# AI Software Development Orchestration Configuration
# Optimized Hybrid Profile: Paid DeepSeek for Planning/Coding + Free Gemini with DeepSeek Failover
max_cost_usd: 2.00
max_tokens: 500000
test_timeout_seconds: 60
max_edit_retries: 3
max_plan_backtracks: 2

# Extra dependency directories to mount in isolated git worktrees
worktree_junctions:
  - "node_modules"
  - ".venv"
  - "vendor"

providers:
  deepseek:
    name: deepseek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    default_model: deepseek-chat
  gemini:
    name: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    default_model: gemini-3.8-flash

roles:
  triage:
    provider: gemini
    model: gemini-3.8-flash       # Primary: Free 1M context
    fallbacks:
      - provider: deepseek
        model: deepseek-chat      # Fallback: Instant failover on 503/429
  reproduce:
    provider: gemini
    model: gemini-3.8-flash
    fallbacks:
      - provider: deepseek
        model: deepseek-chat
  planner:
    provider: deepseek
    model: deepseek-reasoner      # Primary: DeepSeek-R1 chain-of-thought
    fallbacks:
      - provider: deepseek
        model: deepseek-chat
  coder:
    provider: deepseek
    model: deepseek-chat          # DeepSeek-V3 for fast atomic edits
  reviewer:
    provider: gemini
    model: gemini-3.8-flash
    fallbacks:
      - provider: deepseek
        model: deepseek-chat
