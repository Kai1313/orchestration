# AI Software Development Orchestration Configuration
# Optimized Hybrid Profile: Paid DeepSeek for Planning/Coding + Free Gemini for Everything Else
max_cost_usd: 2.00
max_tokens: 500000
test_timeout_seconds: 60
max_edit_retries: 3
max_plan_backtracks: 2

providers:
  deepseek:
    name: deepseek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    default_model: deepseek-chat
  gemini:
    name: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    default_model: gemini-2.5-flash

roles:
  triage:
    provider: gemini
    model: gemini-2.5-flash       # FREE: 1M context to read large repo maps
  reproduce:
    provider: gemini
    model: gemini-2.5-flash       # FREE: fast test case generation
  planner:
    provider: deepseek
    model: deepseek-reasoner      # PAID: DeepSeek-R1 deep chain-of-thought
  coder:
    provider: deepseek
    model: deepseek-chat          # PAID: DeepSeek-V3 / V4 for fast, precise code edits
  reviewer:
    provider: gemini
    model: gemini-2.5-flash       # FREE: reads git diff and writes PR summary
